name: Morning Brief

on:
  schedule:
    # 06:00 KST briefing target; avoid the top-of-hour Actions queue.
    - cron: '45 5 * * *'
      timezone: Asia/Seoul
  workflow_dispatch:

# Ordinary pushes already start the repository's branch-based Pages deployment.
# Running this workflow on push as well creates competing Pages deployments.

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Collect latest headlines
        run: python3 scripts/update_news.py --output data/news.json
      - name: Collect delayed market snapshot
        run: python3 scripts/update_market.py --output data/market.json
      - name: Commit daily snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news.json data/market.json
          if ! git diff --cached --quiet; then
            git commit -m "Update morning brief data"
            git push
          fi
