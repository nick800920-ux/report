<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>자산관리</title>
<style>
:root{--bg:#f3f5f9;--card:#fff;--ink:#1b2430;--sub:#6b7686;--line:#e3e8ef;--pri:#2457d6;--pri-soft:#e8eefc;--pos:#0f9d6b;--neg:#d6453d;--radius:14px}
@media (prefers-color-scheme:dark){:root{--bg:#10141a;--card:#1a2029;--ink:#e8edf3;--sub:#93a0b1;--line:#2a323d;--pri:#6c93ff;--pri-soft:#202c4a;--pos:#38c690;--neg:#ff7a72}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.45}
button{font:inherit;color:inherit;cursor:pointer}
.top{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:1px solid var(--line);padding:calc(10px + env(safe-area-inset-top)) 14px 10px;display:flex;align-items:center;justify-content:space-between}
.top h1{font-size:17px;margin:0}
.ib{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:6px 10px;font-size:14px}
#view{max-width:780px;margin:0 auto;padding:12px 12px 100px}
.nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:20}
.nav button{flex:1;border:0;background:none;padding:8px 0 7px;color:var(--sub);font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px}
.nav button span{font-size:19px;line-height:1}
.nav button.on{color:var(--pri);font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:12px;margin-bottom:12px}
.ch{font-weight:700;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center}
.sub{color:var(--sub);font-size:12px}
.pos{color:var(--pos)}.neg{color:var(--neg)}
.kpi{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.kpi>div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 8px;text-align:center}
.kpi small{display:block;color:var(--sub);font-size:11px}
.kpi b{font-size:15px;word-break:break-all}
.mnav{display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:12px}
.mnav button{border:1px solid var(--line);background:var(--card);border-radius:10px;width:40px;height:38px;font-size:18px}
.mnav input{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;height:38px;padding:0 10px;font:inherit;font-weight:700;text-align:center}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.tbl{width:100%;border-collapse:collapse;font-size:13px;white-space:nowrap}
.tbl th,.tbl td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:right}
.tbl th:first-child,.tbl td:first-child{text-align:left;position:sticky;left:0;background:var(--card);font-weight:600}
.tbl th{color:var(--sub);font-weight:600;font-size:12px}
.tbl tr.tot td{font-weight:700;background:var(--pri-soft)}
.tbl tr.tot td:first-child{background:var(--pri-soft)}
.tbl tr[data-act]{cursor:pointer}
.tbl tr.fut td{opacity:.45}
.bars{display:flex;gap:3px}.bc{flex:1;text-align:center}
.bb{height:80px;display:flex;align-items:flex-end;gap:2px;justify-content:center}
.bb i{width:38%;border-radius:3px 3px 0 0;min-height:1px}
.bi{background:var(--pos)}.be{background:var(--neg)}
.sbc{flex:1;text-align:center;cursor:pointer;min-width:0}
.sbv{font-size:9px;color:var(--sub);height:13px;line-height:13px;white-space:nowrap;overflow:hidden}
.sbb{height:140px;display:flex;flex-direction:column-reverse}
.sbb i{display:block;width:72%;margin:0 auto}
.sbb i:last-child{border-radius:3px 3px 0 0}
.sw{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.lg2{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:11px;color:var(--sub);margin-top:8px}
.tbl td.cl{text-align:left}
.tbl td[data-act]{cursor:pointer}
.tbl tr[data-act]:active td,.tbl td[data-act]:active{background:var(--pri-soft)}
.lg{display:flex;gap:12px;font-size:11px;color:var(--sub);margin-top:4px}
.lg i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px}
.pr{display:flex;justify-content:space-between;align-items:center;padding:9px 4px;border-bottom:1px solid var(--line);gap:8px}
.pr.tg,.pr.it{cursor:pointer}
.pr .pl{display:flex;align-items:center;gap:4px;min-width:0;flex-wrap:wrap}
.pr small{color:var(--sub);font-size:11px;margin-left:4px}
.pr b{font-variant-numeric:tabular-nums;white-space:nowrap}
.pr.d1{padding-left:18px;background:rgba(127,127,127,.05)}
.pr.d2{padding-left:32px;background:rgba(127,127,127,.09);font-size:13px}
.pr.d3{padding-left:44px;background:rgba(127,127,127,.12);font-size:13px}
.pr b.tot{font-size:16px}
.pr.totrow{background:var(--pri-soft);border-radius:8px;font-weight:700;border:0;margin-top:4px}
.car{font-style:normal;display:inline-block;transition:transform .15s;color:var(--sub);width:14px}
.car.o{transform:rotate(90deg)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
label.f{display:block;font-size:12px;color:var(--sub);margin-bottom:8px}
.in,select.in,textarea.in{display:block;width:100%;margin-top:3px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:9px;padding:9px 10px;font:inherit;min-width:0}
.in.r{text-align:right}
.chip{display:inline-block;padding:2px 8px;border-radius:99px;background:var(--pri-soft);color:var(--pri);font-size:11px;font-weight:600}
.chip.cc{background:#fff1e0;color:#b45f06}
.chip.ct{background:#e3f6ec;color:#0b7a52}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chips button{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:6px 12px;font-size:13px}
.chips button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.btn{border:0;background:var(--pri);color:#fff;border-radius:10px;padding:10px 14px;font-weight:600}
.btn.g{background:var(--pri-soft);color:var(--pri)}
.btn.d{background:#fdeceb;color:var(--neg)}
.btn.w{width:100%}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.fab{position:fixed;right:16px;bottom:calc(72px + env(safe-area-inset-bottom));width:54px;height:54px;border-radius:50%;border:0;background:var(--pri);color:#fff;font-size:28px;box-shadow:0 4px 14px rgba(0,0,0,.3);z-index:15}
.ph{display:flex;justify-content:space-between;align-items:center;gap:8px;cursor:pointer}
.ph b{display:block}
.lcard{border:1px solid var(--line);border-radius:12px;padding:10px;margin-top:10px}
.lh{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.hint{font-size:11px;color:var(--sub);margin:-4px 0 6px}
.irow{display:grid;grid-template-columns:34px repeat(4,1fr);gap:6px;align-items:center;margin-bottom:6px}
.irow.h{font-size:11px;color:var(--sub);text-align:center}
.irow .mn{font-weight:700;font-size:13px}
.irow .in{margin:0;padding:8px 6px;font-size:13px}
.mbg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.mbg[hidden],#pv[hidden]{display:none}
.sheet{background:var(--card);width:100%;max-width:560px;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto}
.sheet h3{margin:0 0 12px}
.seg{display:flex;gap:6px;margin-bottom:10px}
.seg label{flex:1;text-align:center;border:1px solid var(--line);border-radius:10px;padding:9px;cursor:pointer;font-weight:600;font-size:14px}
.seg input{display:none}
.seg input:checked+span{color:var(--pri)}
.seg label:has(input:checked){background:var(--pri-soft);border-color:var(--pri)}
.dayh{font-size:12px;color:var(--sub);margin:12px 4px 4px;font-weight:600}
.txr{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:6px;cursor:pointer}
.txr .t1{font-weight:600}
.banner{background:var(--pri-soft);color:var(--pri);border-radius:12px;padding:10px 12px;margin-bottom:12px;font-size:13px;display:flex;justify-content:space-between;gap:8px;align-items:center}
#toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#222;color:#fff;padding:8px 14px;border-radius:99px;font-size:13px;z-index:99;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:.95}
.empty{text-align:center;color:var(--sub);padding:24px 8px}
/* ---- 출력 미리보기 ---- */
#pv{position:fixed;inset:0;z-index:60;background:#888;display:flex;flex-direction:column}
.pbar{background:var(--card);padding:calc(8px + env(safe-area-inset-top)) 10px 8px;display:flex;gap:6px;flex-wrap:wrap;align-items:center;border-bottom:1px solid var(--line)}
.pbar select,.pbar input{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:7px;font:inherit;font-size:13px}
#pscroll{flex:1;overflow:auto;padding:8px}
#pwrap{margin:0 auto;overflow:hidden}
.paper{background:#fff;color:#000;box-shadow:0 2px 12px rgba(0,0,0,.4);padding:10mm;box-sizing:border-box;font-size:9pt;line-height:1.35}
.paper.portrait{width:210mm;min-height:297mm}
.paper.landscape{width:297mm;min-height:210mm}
.paper h1{font-size:16pt;margin:0 0 2mm}
.paper h2{font-size:11pt;margin:5mm 0 1.5mm;border-left:3px solid #2457d6;padding-left:6px}
.paper .rh{border-bottom:2px solid #000;padding-bottom:2mm;margin-bottom:3mm;font-size:8.5pt;color:#333}
.paper table{width:100%;border-collapse:collapse;margin-bottom:2mm}
.paper th,.paper td{border:1px solid #888;padding:1.5px 4px;font-size:8.5pt}
.paper th{background:#eceff5;text-align:center}
.paper td.n{text-align:right;font-variant-numeric:tabular-nums}
.paper td.c{text-align:center}
.paper tr.t td{font-weight:700;background:#f3f5f9}
.paper tr.g td{background:#f7f7f7;font-weight:600}
.paper td.i{padding-left:14px;color:#222}
.paper.portrait.dense th,.paper.portrait.dense td{font-size:8pt}
@media print{
 html,body{background:#fff!important}
 .top,#view,.nav,.fab,#modal,#toast,.pbar{display:none!important}
 #pv{position:static!important;background:#fff!important;display:block!important}
 #pscroll{overflow:visible!important;padding:0!important}
 #pwrap{width:auto!important;height:auto!important;overflow:visible!important}
 .paper{transform:none!important;box-shadow:none!important;padding:0!important;width:auto!important;min-height:0!important}
 .paper tr{page-break-inside:avoid}
}
</style>

const act=(m,s,e)=>(!s||m>=s)&&(!e||m<=e);
// 선불: 해당 월에 반영 / 후불: 다음 달에 반영 (기간 전체가 한 달씩 뒤로 이동)
function flowOn(m,l,p){const s=l.start||p.start,e=l.end||p.end,sh=l.timing==='후불'?1:0;return act(m,s?mAdd(s,sh):'',e?(l.kind==='대출'?e:mAdd(e,sh)):'')}
function plines(p,m){const out=[];(p.lines||[]).forEach(l=>{const a=+l.amount||0;
  if(l.kind==='대출'){if(flowOn(m,l,p)){const amt=(l.monthly!==''&&l.monthly!=null&&!isNaN(+l.monthly))?+l.monthly:Math.round(a*(+l.rate||0)/1200);out.push({t:'interest',l,p,amt})}}
  else if(l.kind==='월세수입'){if(flowOn(m,l,p))out.push({t:'rentIn',l,p,amt:a})}
  else if(l.kind==='임차료'){if(flowOn(m,l,p))out.push({t:'rentOut',l,p,amt:a})}});return out}
function pbal(p,m){const r={estate:0,leaseDep:0,loan:0,depRecv:0};if(act(m,p.start,p.end))r.estate=+p.purchase||0;
  (p.lines||[]).forEach(l=>{if(!act(m,l.start||p.start,l.end||p.end))return;const a=+l.amount||0;
    if(l.kind==='대출')r.loan+=a;else if(l.kind==='임대보증금')r.depRecv+=a;else if(l.kind==='임차보증금')r.leaseDep+=a});return r}
function flowsAll(m,t){const o=[];S.props.forEach(p=>plines(p,m).forEach(f=>{if(f.t===t)o.push(f)}));return o}
function carry(key,m){let best=null;for(const k of Object.keys(S.bal)){const v=S.bal[k][key];if(k<=m&&v!==''&&v!=null&&(best===null||k>best))best=k}return best?+S.bal[best][key]:0}

const cardPay=t=>{if(t.pay)return t.pay;const co=cutFor(t),m=t.date.slice(0,7);return +t.date.slice(8)<=co?m:mAdd(m,1)}; // 결제월(명세서월)

  if(r.freq==='weekly'){for(let d=1;d<=dim(y,mo);d++){if(new Date(y,mo-1,d).getDay()===+r.dow)out.push(mkRec(r,m,d))}}

function monthData(m){
  const t={estate:0,leaseDep:0,loan:0,depRecv:0,rentIn:0,interest:0,rentOut:0};
  S.props.forEach(p=>{const b=pbal(p,m);for(const k in b)t[k]+=b[k];plines(p,m).forEach(f=>{t[f.t]+=f.amt})});

}

  h+=`<tr><td>기타수익</td>${N(d.other)}</tr><tr><td>와이프 수익</td>${N(d.wife)}</tr><tr class="t"><td>소득 합계</td>${N(d.income)}</tr></tbody></table>`;
  const grp=(title,list)=>{let g={};list.forEach(t=>{const c=t.cat||'기타';(g[c]=g[c]||{s:0,a:[]});g[c].s+=+t.amount||0;g[c].a.push(t)});
    let r=`<tr class="g"><td>${title}</td>${N(sum(list))}</tr>`;Object.entries(g).sort((a,b)=>b[1].s-a[1].s).forEach(([c,v])=>{r+=`<tr><td class="i"><b>${esc(c)}</b></td>${N(v.s)}</tr>`;v.a.sort((a,b)=>a.date<b.date?-1:1).forEach(t=>{r+=`<tr><td class="i" style="padding-left:28px">${+t.date.slice(8)}일 ${esc(t.item)}${t.note?' ('+esc(t.note)+')':''}</td>${N(t.amount)}</tr>`})});return r};
  h+=`<h2>지출</h2><table><tbody>${grp(`카드지불금액 (${mLabel(m)} 결제분)`,cardTx(m))}${grp('계좌이체금액',trTx(m))}`;
  h+=`<tr class="g"><td>대출이자</td>${N(d.interest)}</tr>`;flowsAll(m,'interest').forEach(f=>{h+=`<tr><td class="i">${esc(f.p.name)} · ${esc(f.l.name)} (${f.l.timing})</td>${N(f.amt)}</tr>`});
  h+=`<tr class="g"><td>임차료</td>${N(d.rentOut)}</tr>`;flowsAll(m,'rentOut').forEach(f=>{h+=`<tr><td class="i">${esc(f.p.name)} · ${esc(f.l.name)} (${f.l.timing})</td>${N(f.amt)}</tr>`});
  h+=`<tr class="t"><td>지출 합계</td>${N(d.expense)}</tr></tbody></table><h2>수익</h2><table><tbody><tr class="t"><td>수익 (소득 − 지출)</td>${N(d.profit)}</tr></tbody></table>`;
  h+=`<h2>월말 자산 · 부채</h2><table><tbody><tr><td>부동산 매입금액</td>${N(d.estate)}</tr><tr><td>임대보증금(받은 보증금)</td>${N(d.depRecv)}</tr><tr><td>임차보증금</td>${N(d.leaseDep)}</tr><tr><td>금융자산</td>${N(d.fin)}</tr><tr class="g"><td>자산 합계</td>${N(d.assets)}</tr><tr><td>대출 잔액</td>${N(d.loan)}</tr><tr><td>기타부채</td>${N(d.od)}</tr><tr class="g"><td>부채 합계</td>${N(d.liab)}</tr><tr class="t"><td>순자산</td>${N(d.net)}</tr></tbody></table>`;return h}
function repProps(o){const m=o.ym;let h=head('부동산 현황',mLabel(m)+' 기준');
  if(!S.props.length)return h+'<p>등록된 부동산이 없습니다.</p>';
  S.props.forEach(p=>{const fl=plines(p,m),rin=fl.filter(f=>f.t==='rentIn').reduce((s,f)=>s+f.amt,0),it=fl.filter(f=>f.t==='interest').reduce((s,f)=>s+f.amt,0),ro=fl.filter(f=>f.t==='rentOut').reduce((s,f)=>s+f.amt,0);
    h+=`<h2>${esc(p.name)} (${esc(p.type)})</h2><table><tbody><tr><th>매입금액</th><td class="n">${fmt(p.purchase)}</td><th>기간</th><td class="c">${p.start||'-'} ~ ${p.end||''}</td><th>비고</th><td>${esc(p.note)}</td></tr></tbody></table>`;
    if((p.lines||[]).length){h+=`<table><thead><tr><th>구분</th><th>항목</th><th>금액</th><th>이율</th><th>방식</th><th>기간</th><th>비고</th></tr></thead><tbody>`;
      p.lines.forEach(l=>{const K=KIND[l.kind]||{lab:l.kind,t:0};h+=`<tr><td>${K.lab}</td><td>${esc(l.name)}</td>${N(l.amount)}<td class="c">${l.kind==='대출'?((l.monthly!==''&&l.monthly!=null)?'월 '+fmt(l.monthly):(l.rate||0)+'%'):''}</td><td class="c">${K.t?l.timing:''}</td><td class="c">${l.start||l.end?(l.start||'')+' ~ '+(l.end||''):'부동산 기간'}</td><td>${esc(l.note)}</td></tr>`});h+=`</tbody></table>`}
    h+=`<table><tbody><tr><th>${+m.slice(5)}월 월세수입</th>${N(rin)}<th>대출이자</th>${N(it)}<th>임차료</th>${N(ro)}<th>손익</th>${N(rin-it-ro)}</tr></tbody></table>`});
  return h}
function repTx(o){const m=o.ym,list=allTx(m).sort((a,b)=>a.date<b.date?-1:1),cs=sum(list.filter(t=>t.method==='카드')),ts=sum(list.filter(t=>t.method==='계좌이체'));
  let h=head(`${mLabel(m)} 지출 내역`,`카드 사용 ${fmt(cs)} · 계좌이체 ${fmt(ts)}`);
  h+=`<table><thead><tr><th>일자</th><th>결제</th><th>카테고리</th><th>내용</th><th>금액</th><th>비고</th></tr></thead><tbody>`;
  list.forEach(t=>{h+=`<tr><td class="c">${+t.date.slice(8)}일</td><td class="c">${t.method}</td><td>${esc(t.cat)}</td><td>${esc(t.item)}</td>${N(t.amount)}<td>${esc(t.note)}</td></tr>`});
  h+=`<tr class="t"><td colspan="4" class="c">합계</td>${N(cs+ts)}<td></td></tr></tbody></table>`;
  const g={};list.forEach(t=>{g[t.cat]=(g[t.cat]||0)+(+t.amount||0)});
  h+=`<h2>카테고리별 합계</h2><table><tbody>${Object.entries(g).sort((a,b)=>b[1]-a[1]).map(([c,v])=>`<tr><td>${esc(c)}</td>${N(v)}</tr>`).join('')}</tbody></table>`;return h}

/* ================= 이벤트 ================= */
function buildHtml(){flushInput();save();
  const c=document.documentElement.cloneNode(true);
  ['view','nav','modal','cfm','toast','paper','pgstyle'].forEach(id=>{const e=c.querySelector('#'+id);if(e)e.innerHTML=''});
  ['modal','cfm','pv'].forEach(id=>{const e=c.querySelector('#'+id);if(e)e.setAttribute('hidden','')});
  const t=c.querySelector('#toast');if(t)t.className='';c.querySelector('body').removeAttribute('class');
  c.querySelector('#embeddedData').textContent=JSON.stringify(S).replace(/</g,'\\u003c');
  return '<!DOCTYPE html>\n'+c.outerHTML}
function exportHtml(){try{dl('asset-manager-'+todayStr()+'.html',buildHtml(),'text/html')}catch(x){toast('저장 실패: '+x.message)}}
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),1800)}
let DLX=null;
const isTouch=()=>/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)||(navigator.maxTouchPoints>1&&/Mac/.test(navigator.platform));
const inFrame=()=>{try{return window.top!==window}catch(e){return true}};
function dlFallback(){if(!DLX)return;DLX.url=URL.createObjectURL(new Blob([DLX.text],{type:DLX.type}));$('#modal').hidden=false;$('#modal').innerHTML=`<div class="sheet"><h3>파일 저장</h3>
  <div class="sub" style="margin-bottom:12px">파일명: <b>${esc(DLX.name)}</b></div>
  <a class="btn w" id="dl_a" data-act="dlSaved" href="${DLX.url}" download="${esc(DLX.name)}" style="display:block;text-align:center;text-decoration:none;box-sizing:border-box">💾 저장</a>
  <div class="sub" style="margin:14px 0 8px">위 저장 버튼이 안 되면 아래 방법을 사용하세요.</div>
  <div class="btns" style="flex-direction:column"><button class="btn g" data-act="dlOpen">🔗 새 탭에서 열기 (브라우저 메뉴로 저장)</button><button class="btn g" data-act="dlCopy">📋 전체 내용 복사</button></div>
  <div class="sub" style="margin:10px 0 6px">복사한 내용은 메모 앱 등에 붙여넣고 확장자를 <b>${esc(DLX.name.split('.').pop())}</b>로 저장하세요.</div>
  <textarea id="dl_ta" class="in" rows="3" readonly></textarea>
  <div class="btns" style="margin-top:10px"><button class="btn g w" data-act="mclose">닫기</button></div></div>`;$('#dl_ta').value=DLX.text}
function anchorDl(){try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([DLX.text],{type:DLX.type}));a.download=DLX.name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500);return true}catch(e){return false}}
function dl(name,text,type){DLX={name,text,type};
  if(isTouch()||inFrame()){dlFallback();return}
  if(anchorDl())toast('다운로드를 시작했습니다 (안 되면 더보기 > 저장이 안 될 때)');else dlFallback()}
const ACT={
  tab:t=>{UI.tab=t.dataset.t;render();scrollTo(0,0)},
  nav:t=>{UI.ym=mAdd(UI.ym,+t.dataset.d);UI.year=+UI.ym.slice(0,4);render()},
  ynav:t=>{UI.year+=+t.dataset.d;render()},
  goPL:t=>{UI.ym=t.dataset.m;UI.tab='pl';render();scrollTo(0,0)},
  tog:t=>{const k=t.dataset.k;UI.open[k]=!UI.open[k];render()},
  expandAll:()=>{for(let i=0;i<4;i++){KEYS=new Set();render();KEYS.forEach(k=>UI.open[k]=true)}render()},
  collapseAll:()=>{UI.open={};render()},
  propTog:t=>{UI.propOpen[t.dataset.id]=!UI.propOpen[t.dataset.id];render()},
  addProp:()=>{const id=uid();S.props.push({id,name:'새 부동산',type:'아파트',purchase:'',start:'',end:'',note:'',lines:[]});UI.propOpen[id]=true;save();render()},
  delProp:t=>{const id=t.dataset.id;ask('이 부동산과 모든 항목을 삭제할까요?',()=>{S.props=S.props.filter(p=>p.id!==id);save();render()})},
  addLine:t=>{const p=S.props.find(x=>x.id===t.dataset.id);p.lines.push({id:uid(),kind:t.dataset.k,name:'',amount:'',rate:'',monthly:'',timing:'후불',start:'',end:'',note:''});save();render()},
  delLine:t=>{const p=S.props.find(x=>x.id===t.dataset.id);p.lines=p.lines.filter(l=>l.id!==t.dataset.lid);save();render()},
  fm:t=>{UI.fm=t.dataset.v;render()},
  txNew:()=>openTx(null),txOpen:t=>openTx(t.dataset.id),txSave:()=>txSave(false),txSaveMore:()=>txSave(true),
  txDel:()=>{const id=TXE&&TXE.id;if(!id)return;ask('이 내역을 삭제할까요?',()=>{S.tx=S.tx.filter(x=>x.id!==id);save();closeModal();render();toast('삭제됨')})},
  recNew:()=>openRec(null),recOpen:t=>openRec(t.dataset.id),recSave:recSave,
  recDel:()=>{const id=RE&&RE.id;if(!id)return;ask('이 반복 지출을 삭제할까요?\n모든 달의 내역에서 사라집니다.',()=>{S.recur=(S.recur||[]).filter(x=>x.id!==id);save();closeModal();render();toast('삭제됨')})},
  cfYes:()=>{const f=ask.cb;askClose();if(f)f()},cfNo:askClose,
  mclose:closeModal,catOpen:t=>openCat(t.dataset.c,t.dataset.m||''),
  print:openPrint,
  exportHtml:exportHtml,dlSaved:()=>toast('저장을 시작했습니다. 다운로드/파일 앱을 확인하세요'),
  dlOpen:()=>{try{const u=URL.createObjectURL(new Blob([DLX.text],{type:DLX.type==='text/html'?'text/html':'text/plain'}));const w=window.open(u,'_blank');if(!w)toast('새 탭이 막혀 있습니다. 복사를 사용하세요')}catch(e){toast('새 탭이 막혀 있습니다. 복사를 사용하세요')}},
  dlCopy:()=>{const ta=$('#dl_ta');ta.focus();ta.select();ta.setSelectionRange(0,ta.value.length);let ok=false;try{ok=document.execCommand('copy')}catch(e){}if(ok)toast('복사했습니다');else if(navigator.clipboard)navigator.clipboard.writeText(DLX.text).then(()=>toast('복사했습니다')).catch(()=>toast('길게 눌러 직접 복사하세요'));else toast('길게 눌러 직접 복사하세요')},
  showSave:()=>{flushInput();dl('asset-manager-'+todayStr()+'.html',buildHtml(),'text/html')},
  exportJson:()=>{flushInput();save();dl('asset-backup-'+todayStr()+'.json',JSON.stringify(S,null,1),'application/json')},
  importJson:()=>$('#imp').click(),
  exportCsv:()=>{const q=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';const rows=[['날짜','결제','카테고리','내용','금액','비고'],...S.tx.slice().sort((a,b)=>a.date<b.date?-1:1).map(t=>[t.date,t.method,t.cat,t.item,t.amount,t.note])];dl('expenses-'+todayStr()+'.csv','\ufeff'+rows.map(r=>r.map(q).join(',')).join('\n'),'text/csv')},
  importHC:()=>{const n=mergeBatches(S,true)+mergeProps(S,true);save();render();toast(n+'건 추가됨')},
  loadSample:()=>ask('현재 데이터를 샘플로 바꿀까요?',()=>{S=sample();if(!S.recur)S.recur=[];save();render()},'바꾸기'),
  clearAll:()=>ask('모든 데이터를 삭제할까요?\n(JSON 백업을 먼저 받아두세요)',()=>{S=blank();S.seeded=['hc1','sh1','kb1','ac1','sm1','pr1','pr2','rc1','rc2','ov1','ov2'];save();render()},'모두 삭제'),
};
document.addEventListener('click',e=>{const t=e.target.closest('[data-act]');if(t&&ACT[t.dataset.act]){if(t.dataset.act==='tog'&&e.target.closest('input'))return;ACT[t.dataset.act](t,e)}});
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
$('#cfm').addEventListener('click',e=>{if(e.target.id==='cfm')askClose()});
const H={
  prop:(t,v)=>{S.props.find(x=>x.id===t.dataset.id)[t.dataset.f]=v},
  line:(t,v)=>{const p=S.props.find(x=>x.id===t.dataset.id);p.lines.find(x=>x.id===t.dataset.lid)[t.dataset.f]=v},
  inc:(t,v)=>{const m=t.dataset.m;(S.income[m]=S.income[m]||{})[t.dataset.f]=v},
  bal:(t,v)=>{const m=t.dataset.m;(S.bal[m]=S.bal[m]||{})[t.dataset.f]=v},
  ym:(t,v)=>{if(v){UI.ym=v;UI.year=+v.slice(0,4)}},
  fc:(t,v)=>{UI.fc=v},
  set:(t,v)=>{S.settings[t.dataset.f]=v},
  cut:(t,v)=>{S.settings.cardCut[t.dataset.f]=v},
  cats:(t,v)=>{const c=v.split(/[,\n]/).map(s=>s.trim()).filter(Boolean);if(c.length)S.settings.cats=c}
};
document.addEventListener('change',e=>{const t=e.target,a=t.dataset&&t.dataset.a;if(!a||!H[a])return;let v=t.value;if(t.dataset.num!==undefined)v=pn(v);H[a](t,v);save();render()});
const LIVE_SKIP=['ym','fc','cats'];
function commitField(t){const a=t&&t.dataset&&t.dataset.a;if(!a||!H[a]||LIVE_SKIP.includes(a))return false;if(t.tagName!=='INPUT'||t.type==='month'||t.type==='checkbox')return false;let v=t.value;if(t.dataset.num!==undefined)v=pn(v);H[a](t,v);return true}
document.addEventListener('input',e=>{if(commitField(e.target))save()});
function flushInput(){const ae=document.activeElement;if(commitField(ae))save()}
document.addEventListener('focusin',e=>{const t=e.target;if(t.matches&&t.matches('input[data-num],#m_amt'))setTimeout(()=>t.select&&t.select(),0)});
document.addEventListener('change',e=>{if(e.target.id!=='imp')return;const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{S=migrate(JSON.parse(r.result));S.sample=false;save();render();toast('가져왔습니다')}catch(x){toast('파일을 읽을 수 없습니다')}};r.readAsText(f);e.target.value=''});
$('#pr_type').onchange=e=>{PR.type=e.target.value;drawPrint()};
$('#pr_orient').onchange=e=>{PR.orient=e.target.value;drawPrint()};
$('#pr_m').onchange=e=>{if(e.target.value){PR.ym=e.target.value;drawPrint()}};
$('#pr_go').onclick=()=>{fit();window.print()};
$('#pr_x').onclick=()=>{$('#pv').hidden=true};
addEventListener('resize',fit);
render();
</script>
