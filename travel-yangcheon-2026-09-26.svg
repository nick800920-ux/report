<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-labelledby="title desc">
  <title id="title">트래블: 2026년 9월 26일 아이와 양천구 근교 나들이 한 장 요약</title>
  <desc id="desc">서울역사박물관, 서울식물원, 서서울호수공원, 선유도공원 네 곳의 운영 시간, 특징, 비용과 주의사항을 비교한 인포그래픽</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#edf8f5"/><stop offset="1" stop-color="#f8f7ee"/></linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#123d4b"/><stop offset="1" stop-color="#136f69"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#17423e" flood-opacity=".09"/></filter>
    <style>
      text{font-family:'Noto Sans CJK KR','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif}
      .label{font-size:24px;font-weight:800;letter-spacing:1px}
      .title{font-size:59px;font-weight:900;letter-spacing:-2px}
      .subtitle{font-size:27px;font-weight:500}
      .cardtitle{font-size:33px;font-weight:900;letter-spacing:-1.5px;fill:#173b42}
      .body{font-size:23px;font-weight:550;fill:#47636a}
      .small{font-size:20px;fill:#61777c}
      .badge{font-size:19px;font-weight:800}
      .time{font-size:28px;font-weight:800;fill:#145c5a}
    </style>
  </defs>
  <rect width="1080" height="1350" fill="url(#bg)"/>
  <circle cx="985" cy="170" r="160" fill="#d6eee2" opacity=".65"/>
  <circle cx="65" cy="1020" r="165" fill="#e3edcf" opacity=".5"/>
  <rect x="38" y="36" width="1004" height="260" rx="35" fill="url(#hero)" filter="url(#shadow)"/>
  <text x="78" y="88" class="label" fill="#a7e9c6">TRAVEL · TODAY</text>
  <text x="78" y="157" class="title" fill="#ffffff">아이와 오늘 어디 가지?</text>
  <text x="78" y="206" class="subtitle" fill="#d8f2e6">양천구 출발 · 1시간 안팎 나들이 후보 4곳</text>
  <rect x="78" y="232" width="296" height="40" rx="20" fill="#ffffff" opacity=".17"/>
  <text x="98" y="259" font-size="20" font-weight="700" fill="#ffffff">2026. 09. 26. 토요일</text>
  <text x="1005" y="266" font-size="20" font-weight="700" fill="#d8f2e6" text-anchor="end">추석 연휴</text>

  <text x="46" y="345" font-size="25" font-weight="800" fill="#1d5b5b">상황별로 고르세요</text>
  <rect x="38" y="372" width="490" height="352" rx="30" fill="#ffffff" filter="url(#shadow)"/>
  <rect x="62" y="396" width="147" height="40" rx="20" fill="#e7f5e9"/>
  <text x="85" y="424" class="badge" fill="#20764f">오늘만 · 체험</text>
  <text x="62" y="481" class="cardtitle">서울역사박물관</text>
  <text x="62" y="518" class="body">한가위 한마당</text>
  <line x1="62" y1="544" x2="504" y2="544" stroke="#e4efea" stroke-width="2"/>
  <text x="62" y="591" class="time">12:00–16:00  ·  무료</text>
  <text x="62" y="633" class="body">투호 · 제기차기 · 만들기 · 국악</text>
  <text x="62" y="680" class="small">!  일부 만들기는 선착순</text>

  <rect x="552" y="372" width="490" height="352" rx="30" fill="#ffffff" filter="url(#shadow)"/>
  <rect x="576" y="396" width="128" height="40" rx="20" fill="#e7efff"/>
  <text x="600" y="424" class="badge" fill="#4569a3">실내 · 전시</text>
  <text x="576" y="481" class="cardtitle">서울식물원</text>
  <text x="576" y="518" class="body">온실 색 찾기 ‘컬러헌터’</text>
  <line x1="576" y1="544" x2="1018" y2="544" stroke="#e4efea" stroke-width="2"/>
  <text x="576" y="591" class="time">09:30–18:00  ·  유료</text>
  <text x="576" y="633" class="body">식물을 찾고 사진으로 기록</text>
  <text x="576" y="680" class="small">!  온실 입장 마감 17:00</text>

  <rect x="38" y="750" width="490" height="352" rx="30" fill="#ffffff" filter="url(#shadow)"/>
  <rect x="62" y="774" width="128" height="40" rx="20" fill="#fff2d9"/>
  <text x="86" y="802" class="badge" fill="#a66b15">가까움 · 산책</text>
  <text x="62" y="859" class="cardtitle">서서울호수공원</text>
  <text x="62" y="896" class="body">호수 산책 + 어린이 놀이터</text>
  <line x1="62" y1="922" x2="504" y2="922" stroke="#e4efea" stroke-width="2"/>
  <text x="62" y="969" class="time">24시간 개방  ·  무료</text>
  <text x="62" y="1011" class="body">짧고 부담 없는 바깥 나들이</text>
  <text x="62" y="1058" class="small">!  야외 활동, 날씨 확인</text>

  <rect x="552" y="750" width="490" height="352" rx="30" fill="#ffffff" filter="url(#shadow)"/>
  <rect x="576" y="774" width="170" height="40" rx="20" fill="#f4e9fa"/>
  <text x="599" y="802" class="badge" fill="#8453a0">공원 · 특별체험</text>
  <text x="576" y="859" class="cardtitle">선유도공원</text>
  <text x="576" y="896" class="body">물길 탐방 + 명태 장식 만들기</text>
  <line x1="576" y1="922" x2="1018" y2="922" stroke="#e4efea" stroke-width="2"/>
  <text x="576" y="969" class="time">체험 15:00  ·  산책 무료</text>
  <text x="576" y="1011" class="body">예약 어렵다면 산책만 해도 좋아요</text>
  <text x="576" y="1058" class="small">!  체험 예약·잔여 자리 확인</text>

  <rect x="38" y="1128" width="1004" height="120" rx="28" fill="#173f49"/>
  <text x="68" y="1174" font-size="25" font-weight="900" fill="#a7e9c6">트래블의 한 줄 선택</text>
  <text x="68" y="1215" font-size="25" font-weight="700" fill="#ffffff">체험 좋아하면 역사박물관  ·  가까운 외출은 서서울호수공원</text>
  <text x="44" y="1286" font-size="18" fill="#5c7778">※ 목동·자가용 출발 가정. 추석 교통·운영 및 예약은 출발 전 확인하세요.</text>
  <text x="44" y="1317" font-size="17" fill="#6c8582">출처: 서울시 행사·공원 안내 / 서울식물원 전시 안내 (2026.09.26 확인)</text>
</svg>
